[project]
name = "strait-watch"
version = "0.1.0"
description = "Taiwan Strait early-warning dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi",
    "feedparser>=6.0.14",
    "httpx",
    "jinja2",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "selectolax>=0.4.11",
    "tzdata",
    "uvicorn",
    "yfinance>=1.7.0",
]

[tool.uv]
package = false
# Python and packages live inside the repo so the service account can read them
python-preference = "only-managed"
link-mode = "copy"
