[project]
name = "strait-watch"
version = "0.1.0"
description = "Taiwan Strait early-warning dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi",
    "httpx",
    "jinja2",
    "python-dotenv",
    "tzdata",
    "uvicorn",
]

[tool.uv]
package = false
# Python and packages live inside the repo so the service account can read them
python-preference = "only-managed"
link-mode = "copy"
