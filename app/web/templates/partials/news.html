<table>
  <thead><tr><th>Time (SGT)</th><th>Source</th><th>Title</th><th>Tags</th></tr></thead>
  <tbody>
  {% for it in items %}
  <tr>
    <td class="nowrap muted">{{ it.when }}</td>
    <td class="nowrap">{{ it.source }}</td>
    <td><a href="{{ it.url }}" target="_blank" rel="noopener">{{ it.title }}</a></td>
    <td>{% for t in it.tags %}<span class="tag">{{ t }}</span>{% endfor %}</td>
  </tr>
  {% else %}
  <tr><td colspan="4" class="muted">No items match.</td></tr>
  {% endfor %}
  </tbody>
</table>
