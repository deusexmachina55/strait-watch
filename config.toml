[prices]
symbols = ["GC=F", "SI=F", "TSM", "2330.TW", "^SOX", "NVDA", "BTC-USD", "CNH=X", "DX-Y.NYB"]
labels = ["Gold", "Silver", "TSM (ADR)", "TSMC 2330.TW", "SOX", "NVDA", "BTC", "USD/CNH", "DXY"]

[gdelt]
# Dyads counted in the GDELT 2.0 event files (actor country codes, order ignored)
dyads = ["CHN-TWN", "CHN-USA", "CHN-JPN", "CHN-PHL"]
backfill_days = 90

[msa]
# China MSA navigation warning channels on www.msa.gov.cn
backfill_days = 90
military_terms = ["实弹", "射击", "军事", "演习", "演练", "禁航", "GUN FIRING", "FIRING", "MILITARY", "EXERCISE", "ROCKET", "MISSILE"]

[[msa.channels]]
region = "Fujian"
id = "7b08405760384570a0fb44e9204c4b1d"

[[msa.channels]]
