# Strait Watch collector configuration.
# Restart the service after editing: ./service.ps1 restart (elevated)

[keywords]
# An item is relevant when it matches a topic group AND a Taiwan context term,
# or a topic group alone for sources marked context = true.
# Groups in "always" make an item relevant on their own.
context = ["Taiwan", "Taipei", "Taiwan Strait", "Kinmen", "Matsu", "Penghu", "Pratas",
           "台灣", "臺灣", "台湾", "台海", "臺海", "金門", "马祖", "馬祖", "澎湖"]
always = ["exercise_name"]

[keywords.groups]
exercise_name = ["Joint Sword", "Strait Thunder", "聯合利劍", "联合利剑", "海峽雷霆", "海峡雷霆"]
military = ["PLA", "People's Liberation Army", "warship", "destroyer", "aircraft carrier", "Shandong carrier",
            "Fujian carrier", "median line", "ADIZ", "live-fire", "live fire", "military drill", "military exercise",
            "war game", "amphibious", "missile", "Eastern Theater", "解放軍", "解放军", "共機", "共艦", "军演", "軍演",
            "实弹", "實彈", "东部战区", "東部戰區", "中国海軍", "中国軍機", "艦艇", "空母", "無人機"]
blockade = ["blockade", "quarantine", "embargo", "encircle", "封鎖", "封锁"]
# China Coast Guard only; Taiwan's own coast guard (海巡) news is mostly domestic
coast_guard = ["China Coast Guard", "Chinese coast guard", "CCG", "海警"]
mobilization = ["mobilization", "mobilisation", "reservist", "conscription", "動員", "动员"]
evacuation = ["evacuation", "evacuate", "travel advisory", "leave Taiwan", "撤僑", "撤侨"]
diplomatic = ["Taiwan Affairs Office", "reunification", "one-China", "one China", "separatist", "independence",
              "arms sale", "sanction", "國台辦", "国台办", "统一", "統一", "台独", "台獨"]
economic = ["TSMC", "semiconductor", "chip export", "export control", "tariff"]

[[rss]]
name = "Focus Taiwan"
