# Strait Watch collector configuration.
# Restart the service after editing: ./service.ps1 restart (elevated)

[keywords]
# An item is relevant when it matches a topic group AND a Taiwan context term,
# or a topic group alone for sources marked context = true.
# Groups in "always" make an item relevant on their own.
context = ["Taiwan", "Taipei", "Taiwan Strait", "Kinmen", "Matsu", "Penghu", "Pratas",
           "台灣", "臺灣", "台湾", "台海", "臺海", "金門", "马祖", "馬祖", "澎湖"]
always = ["exercise_name"]

[keywords.groups]
exercise_name = ["Joint Sword", "Strait Thunder", "聯合利劍", "联合利剑", "海峽雷霆", "海峡雷霆"]
military = ["PLA", "People's Liberation Army", "warship", "destroyer", "aircraft carrier", "Shandong carrier",
            "Fujian carrier", "median line", "ADIZ", "live-fire", "live fire", "military drill", "military exercise",
            "war game", "amphibious", "missile", "Eastern Theater", "解放軍", "解放军", "共機", "共艦", "军演", "軍演",
            "实弹", "實彈", "东部战区", "東部戰區", "中国海軍", "中国軍機", "艦艇", "空母", "無人機"]
blockade = ["blockade", "quarantine", "embargo", "encircle", "封鎖", "封锁"]
# China Coast Guard only; Taiwan's own coast guard (海巡) news is mostly domestic
coast_guard = ["China Coast Guard", "Chinese coast guard", "CCG", "海警"]
mobilization = ["mobilization", "mobilisation", "reservist", "conscription", "動員", "动员"]
evacuation = ["evacuation", "evacuate", "travel advisory", "leave Taiwan", "撤僑", "撤侨"]
diplomatic = ["Taiwan Affairs Office", "reunification", "one-China", "one China", "separatist", "independence",
              "arms sale", "sanction", "國台辦", "国台办", "统一", "統一", "台独", "台獨"]
economic = ["TSMC", "semiconductor", "chip export", "export control", "tariff"]

[[rss]]
name = "Focus Taiwan"
url = "https://feeds.feedburner.com/rsscna/engnews"
context = true

[[rss]]
name = "Taipei Times"
url = "https://www.taipeitimes.com/xml/index.rss"
context = true

[[rss]]
name = "SCMP China"
url = "https://www.scmp.com/rss/4/feed"

[[rss]]
name = "Defense News"
url = "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml"

[[rss]]
name = "Reuters"
url = "https://news.google.com/rss/search?q=(Taiwan+OR+China)+site:reuters.com+when:2d&hl=en-US&gl=US&ceid=US:en"

[[rss]]
name = "USNI News"
url = "https://news.google.com/rss/search?q=site:news.usni.org+when:2d&hl=en-US&gl=US&ceid=US:en"

[[rss]]
name = "Global Times"
url = "https://news.google.com/rss/search?q=Taiwan+site:globaltimes.cn+when:2d&hl=en-US&gl=US&ceid=US:en"

[[rss]]
name = "Xinhua"
url = "https://news.google.com/rss/search?q=Taiwan+site:news.cn+when:2d&hl=en-US&gl=US&ceid=US:en"

[prices]
# Shown on the Overview page. The index itself uses TSM, ^SOX, GC=F and CNH=X only.
overview = ["GC=F", "SI=F", "TSM", "2330.TW", "^SOX", "NVDA", "BTC-USD", "CNH=X", "DX-Y.NYB"]

[[prices.groups]]
name = "Taiwan and semiconductors"
symbols = ["TSM", "2330.TW", "^TWII", "^SOX", "NVDA", "AMD", "INTC", "ASML"]
labels = ["TSM (ADR)", "TSMC 2330.TW", "TAIEX", "SOX", "NVDA", "AMD", "INTC", "ASML"]

[[prices.groups]]
name = "Magnificent 7"
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "TSLA", "NVDA"]
labels = ["Apple", "Microsoft", "Alphabet", "Amazon", "Meta", "Tesla", "NVIDIA"]

[[prices.groups]]
name = "Commodities"
symbols = ["GC=F", "SI=F", "PL=F", "CL=F", "HG=F"]
labels = ["Gold", "Silver", "Platinum", "Crude oil (WTI)", "Copper"]

[[prices.groups]]
name = "Crypto"
symbols = ["BTC-USD", "ETH-USD", "XRP-USD", "SOL-USD", "HYPE32196-USD", "BNB-USD"]
labels = ["BTC", "ETH", "XRP", "SOL", "HYPE", "BNB"]

[[prices.groups]]
name = "FX"
symbols = ["CNH=X", "DX-Y.NYB", "TWD=X", "JPY=X"]
labels = ["USD/CNH", "DXY", "USD/TWD", "USD/JPY"]

[gdelt]
# Dyads counted in the GDELT 2.0 event files (actor country codes, order ignored)
dyads = ["CHN-TWN", "CHN-USA", "CHN-JPN", "CHN-PHL"]
backfill_days = 90

[msa]
# China MSA navigation warning channels on www.msa.gov.cn
backfill_days = 90
military_terms = ["实弹", "射击", "军事", "演习", "演练", "禁航", "GUN FIRING", "FIRING", "MILITARY", "EXERCISE", "ROCKET", "MISSILE"]

[[msa.channels]]
region = "Fujian"
id = "7b08405760384570a0fb44e9204c4b1d"

[[msa.channels]]
region = "Zhejiang"
id = "8e10ea74eb9e4c9690f8f891968add80"

[[msa.channels]]
region = "Shanghai"
id = "94df14ce1110415da44e67593e76619f"

[[msa.channels]]
region = "Guangdong"
id = "1e478d409e854918bf12478b8a19f4a8"

[[msa.channels]]
region = "Shandong"
id = "36ea3354c8f84953aba082d6d989c750"

[polymarket]
search = "china taiwan"
# Only events whose title matches all of these words (case-insensitive)
title_must_contain = ["china", "taiwan"]

[scoring]
# Sub-score weights for the composite index
weights = { military = 0.45, economic = 0.15, diplomatic = 0.25, rhetoric = 0.15 }
# Points of score per standard deviation above baseline (50 = baseline)
points_per_sigma = 15
# Days of history before observed baselines fully replace the priors below
prior_weight_days = 14

# Prior mean/std used while an indicator has little history (typical 2024-2025 values)
[scoring.priors]
pla_aircraft = [15, 10]
pla_entered = [10, 8]
pla_navy = [7, 2]
pla_official = [1, 1]
msa_military = [2, 2]
msa_fujian_military = [0.2, 0.5]
gdelt_twn_material = [3, 3]
gdelt_twn_verbal = [8, 5]
gdelt_usa_material = [15, 10]
japan_sightings = [0.5, 0.8]
cga_incursions = [0.3, 0.6]
items_military = [3, 3]
items_diplomatic = [2, 2]
items_economic = [1, 1.5]
items_state_media = [1, 1.5]
polymarket = [5, 2]
tsm_5d = [0, 4]
gold_5d = [0, 2.5]
cnh_5d = [0, 0.6]
sox_5d = [0, 4]

# Indicators per sub-score with weights. Negative weight means a lower value raises the score.
[scoring.subscores]
military = { pla_aircraft = 1.0, pla_entered = 1.0, pla_navy = 0.7, pla_official = 0.3, msa_military = 0.7, msa_fujian_military = 1.0, gdelt_twn_material = 0.7, japan_sightings = 0.5, cga_incursions = 0.7 }
economic = { tsm_5d = -1.0, sox_5d = -0.5, gold_5d = 1.0, cnh_5d = 1.0, items_economic = 0.5 }
diplomatic = { gdelt_twn_verbal = 0.8, gdelt_usa_material = 0.6, items_diplomatic = 0.7, polymarket = 1.0, advisory = 1.0 }
rhetoric = { items_state_media = 1.0, items_military = 0.7 }

[tripwires]
# Composite index thresholds that alert on crossing upward
index_levels = [60, 75, 90]

# Keyword tripwires match new relevant items (title + snippet). cooldown in hours.
[[tripwires.keywords]]
name = "named_exercise"
severity = 5
terms = ["Joint Sword", "Strait Thunder", "聯合利劍", "联合利剑", "海峽雷霆", "海峡雷霆"]
cooldown = 24

[[tripwires.keywords]]
name = "blockade"
severity = 5
terms = ["blockade", "quarantine", "封鎖", "封锁", "隔离检疫"]
require_context = true
cooldown = 24

[[tripwires.keywords]]
name = "live_fire"
severity = 4
terms = ["live-fire", "live fire", "实弹", "實彈"]
require_context = true
cooldown = 24

[[tripwires.keywords]]
name = "no_fly_zone"
severity = 4
terms = ["no-fly zone", "no fly zone", "禁飛區", "禁飞区", "airspace closure"]
require_context = true
cooldown = 24

[[tripwires.keywords]]
name = "evacuation"
severity = 5
terms = ["evacuation advisory", "evacuate", "leave Taiwan", "撤僑", "撤侨"]
require_context = true
cooldown = 48

[[tripwires.keywords]]
name = "mobilization"
severity = 4
terms = ["reserve mobilization", "reservists", "mobilisation", "conscription", "動員令", "动员令"]
require_context = true
cooldown = 48

# Indicator tripwires: fire when today's z-score exceeds sigma (or value exceeds absolute floor)
[[tripwires.indicators]]
name = "pla_aircraft_spike"
indicator = "pla_aircraft"
sigma = 2.0
absolute = 45
severity = 3
cooldown = 24

[[tripwires.indicators]]
name = "pla_navy_spike"
indicator = "pla_navy"
sigma = 2.0
absolute = 14
severity = 3
cooldown = 24

[[tripwires.indicators]]
name = "msa_fujian_military"
indicator = "msa_fujian_military"
sigma = 0
absolute = 1
severity = 3
cooldown = 24

[[tripwires.indicators]]
name = "polymarket_jump"
indicator = "polymarket"
sigma = 2.5
absolute = 15
severity = 3
cooldown = 24
